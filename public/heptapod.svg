<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- roughens the vector edges into a hand-inked, brushy look -->
    <filter id="ink" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <!-- pale disc the ink sits on (like the film's projected screen) -->
  <circle cx="100" cy="100" r="97" fill="#edefe4"/>
  <g filter="url(#ink)" fill="#0e0e0e" stroke="#0e0e0e">
    <!-- broken ink ring (Arrival-style logogram) -->
    <circle cx="100" cy="100" r="70" fill="none" stroke-width="6.5" stroke-linecap="round"
            stroke-dasharray="250 10 150 8 25 4" transform="rotate(35 100 100)"/>
    <!-- thin wispy tendrils reaching off the ring -->
    <path d="M150 55 q 22 -10 34 -4" fill="none" stroke-width="2" stroke-linecap="round"/>
    <path d="M168 120 q 16 6 26 2" fill="none" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M96 170 q 8 12 24 12" fill="none" stroke-width="1.8" stroke-linecap="round"/>
    <!-- dense splatter node with radiating spikes (top-left) -->
    <g stroke-width="2.4" stroke-linecap="round">
      <line x1="58" y1="60" x2="40" y2="48"/>
      <line x1="58" y1="60" x2="52" y2="36"/>
      <line x1="58" y1="60" x2="70" y2="40"/>
      <line x1="58" y1="60" x2="80" y2="54"/>
      <line x1="58" y1="60" x2="40" y2="66"/>
      <line x1="58" y1="60" x2="76" y2="72"/>
      <line x1="58" y1="60" x2="58" y2="80"/>
      <line x1="58" y1="60" x2="34" y2="58"/>
      <line x1="58" y1="60" x2="66" y2="30"/>
      <line x1="58" y1="60" x2="86" y2="64"/>
    </g>
    <circle cx="58" cy="60" r="11"/>
    <circle cx="49" cy="55" r="5"/>
    <circle cx="67" cy="66" r="4.5"/>
    <!-- scattered ink droplets -->
    <circle cx="90" cy="44" r="2.2"/>
    <circle cx="38" cy="74" r="2"/>
    <circle cx="78" cy="86" r="1.8"/>
  </g>
</svg>
